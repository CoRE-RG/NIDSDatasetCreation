[General]
network = Micro


###############################
# Common Ethernet Configuration

# Ethernet links are 1Gbps
*.*.eth[*].bitrate = 100Mbps

**.ip.limitedBroadcast = true

# disable local multicast loop
**.udp.defaultMulticastLoop = false


#################################
# Network Node Type Configuration

# use TSN switches
*.switch*.typename = "TsnSwitchWithLabeling"
*.node*.typename = "TsnDevice"


###########################
# Application Configuration

# node1 applications
*.node1.numApps = 4
*.node1.app[*].typename = "UdpSourceApp"
*.node1.app[*].io.destAddress = "node2"
*.node1.app[0].source.packetNameFormat = "%M->Timed->%c"
*.node1.app[0].source.packetLength = 1462B # => 1526B on phy
*.node1.app[0].source.productionInterval = 500us
*.node1.app[0].io.destPort = 11006
*.node1.app[1].source.packetNameFormat = "%M->Datasteam->%c"
*.node1.app[1].source.packetLength = 218B # => 276B on phy
*.node1.app[1].source.productionInterval = 125us
*.node1.app[1].io.destPort = 12005
*.node1.app[2].source.packetNameFormat = "%M->Controlsignal->%c"
*.node1.app[2].source.packetLength = 8B # => 110B on phy
*.node1.app[2].source.productionInterval = 500us
*.node1.app[2].io.destPort = 13004
*.node1.app[3].source.packetNameFormat = "%M->Background->%c"
*.node1.app[3].source.packetLength = intuniform(1B, 1462B) # => up to 1526B on phy
*.node1.app[3].source.productionInterval = uniform(125us, 500us)
*.node1.app[3].io.destPort = 10000

# node2 applications
*.node2.numApps = 4
*.node2.app[*].typename = "UdpSinkApp"
*.node2.app[0].display-name = "Timed sink"
*.node2.app[0].io.localPort = 11006
*.node2.app[1].display-name = "Datasteam sink"
*.node2.app[1].io.localPort = 12005
*.node2.app[2].display-name = "Controlsignal sink"
*.node2.app[2].io.localPort = 13004
*.node2.app[3].display-name = "Background sink"
*.node2.app[3].io.localPort = 10000


#####################
# Clock Configuration

# clocks have a random constant drift in all network nodes
*.*.clock.oscillator.driftRate = uniform(-50ppm, 50ppm)

# application traffic sources use the local clock of the network node
*.*.app[*].source.clockModule = "^.^.clock"
*.*.app[*].*.source.clockModule = "^.^.^.clock"

# periodic gates in all traffic shapers use the local clock of the network node
*.*.eth[*].macLayer.queue.transmissionGate[*].clockModule = "^.^.^.^.clock"
# periodic gates in all ingress filters use the local clock of the network node
*.*.bridging.streamFilter.ingress.gate[*].clockModule = "^.^.^.^.clock"


####################################
# Time Synchronization Configuration

# enable time synchronization in all network nodes
*.*.hasTimeSynchronization = true

# master
*.node1.clock.typename = "OscillatorBasedClock"
*.node1.gptp.gptpNodeType = "MASTER_NODE"
*.node1.gptp.slavePort = ""
*.node1.gptp.masterPorts = ["eth0"]

# slave
*.node2.clock.defaultOverdueClockEventHandlingMode = "execute"
*.node2.gptp.slavePort = "eth0"
*.switch1.clock.defaultOverdueClockEventHandlingMode = "execute"
*.switch1.gptp.slavePort = "eth0"
*.switch1.gptp.masterPorts = ["eth1"]


#############################
# Stream Coding Configuration

# enable outgoing TSN streams
*.*.hasOutgoingStreams = true

# node1 identification and encoding
*.node1.bridging.streamIdentifier.identifier.mapping = [{stream: "SSync", packetFilter: expr(name =~ "*Gptp*")},
                                                        {stream: "STimed", packetFilter: expr(has(udp) && udp.destPort == 11006)},
													  	{stream: "SDatasteam", packetFilter: expr(has(udp) && udp.destPort == 12005)},
														{stream: "SControlsignal", packetFilter: expr(has(udp) && udp.destPort == 13004)},
														{stream: "SBackground", packetFilter: expr(has(udp) && udp.destPort == 10000)}]
*.node1.bridging.streamCoder.encoder.mapping = [{stream: "SSync", vlan: 0, pcp: 7},
                                                {stream: "STimed", vlan: 1, pcp: 6},
												{stream: "SDatasteam", vlan: 2, pcp: 5},
												{stream: "SControlsignal", vlan: 3, pcp: 4},
												{stream: "SBackground", vlan: 0, pcp: 0}]

# node2 identification and coding
*.node2.bridging.streamIdentifier.identifier.mapping = [{stream: "SSync", packetFilter: expr(name =~ "*Gptp*")},
                                                        {stream: "STimed", packetFilter: expr(has(udp) && udp.destPort == 11006)},
													  	{stream: "SDatasteam", packetFilter: expr(has(udp) && udp.destPort == 12005)},
														{stream: "SControlsignal", packetFilter: expr(has(udp) && udp.destPort == 13004)},
														{stream: "SBackground", packetFilter: expr(has(udp) && udp.destPort == 10000)}]
*.node2.bridging.streamCoder.decoder.mapping = [{destination: "node2", vlan: 1, pcp: 6, stream: "STimed"},
                                                {destination: "node2", vlan: 2, pcp: 5, stream: "SDatasteam"},
                                                {destination: "node2", vlan: 3, pcp: 4, stream: "SControlsignal"},
                                                {destination: "node2", vlan: 0, pcp: 0, stream: "SBackground"}]
*.node2.bridging.streamCoder.encoder.mapping = [{stream: "SSync", vlan: 0, pcp: 7},
                                                {stream: "STimed", vlan: 1, pcp: 6},
												{stream: "SDatasteam", vlan: 2, pcp: 5},
												{stream: "SControlsignal", vlan: 3, pcp: 4},
												{stream: "SBackground", vlan: 0, pcp: 0}]

# switch identification and coding
*.switch1.bridging.streamIdentifier.identifier.mapping = [{stream: "SSync", packetFilter: expr(name =~ "*Gptp*")}]
*.switch1.bridging.streamCoder.decoder.mapping = [{destination: "node2", vlan: 1, pcp: 6, stream: "STimed"},
                                                  {destination: "node2", vlan: 2, pcp: 5, stream: "SDatasteam"},
                                                  {destination: "node2", vlan: 3, pcp: 4, stream: "SControlsignal"},
                                                  {destination: "node2", vlan: 0, pcp: 0, stream: "SBackground"},
												  {pcp: 7, stream: "SSync"}]
*.switch1.bridging.streamCoder.encoder.mapping = [{stream: "SSync", vlan: 0, pcp: 7},
                                                  {stream: "STimed", vlan: 1, pcp: 6},
												  {stream: "SDatasteam", vlan: 2, pcp: 5},
												  {stream: "SControlsignal", vlan: 3, pcp: 4},
												  {stream: "SBackground", vlan: 0, pcp: 0}]


###############################
# Traffic Shaping Configuration

# enable egress traffic shaping
*.*.hasEgressTrafficShaping = true

# set traffic classes
*.*.eth[*].macLayer.queue.numTrafficClasses = 8
*.*.eth[*].macLayer.queue.*[0].display-name = "0_background"
*.*.eth[*].macLayer.queue.*[1].display-name = "1_best_effort"
*.*.eth[*].macLayer.queue.*[2].display-name = "2_"
*.*.eth[*].macLayer.queue.*[3].display-name = "3_"
*.*.eth[*].macLayer.queue.*[4].display-name = "4_control"
*.*.eth[*].macLayer.queue.*[5].display-name = "5_data"
*.*.eth[*].macLayer.queue.*[6].display-name = "6_timed"
*.*.eth[*].macLayer.queue.*[7].display-name = "7_sync"

# configure GCLs
*.*.eth[*].macLayer.queue.gateControlList.numeGates = 8
*.*.eth[*].macLayer.queue.gateControlList.mapping = "76543210"
*.*.eth[*].macLayer.queue.transmissionGate[*].scheduleForAbsoluteTime = true

# configure node1
*.node1.eth[0].macLayer.queue.hasGcl = true
*.node1.eth[0].macLayer.queue.gateControlList.offset = 0us
*.node1.eth[0].macLayer.queue.gateControlList.durations = [150us, 100us, 50us, 200us]
*.node1.eth[0].macLayer.queue.gateControlList.gateStates = ["00000000", "01000000", "11000000", "10111111"]
*.node1.eth[0].macLayer.queue.transmissionSelectionAlgorithm[5].typename = "Ieee8021qCreditBasedShaper"
*.node1.eth[0].macLayer.queue.transmissionSelectionAlgorithm[5].idleSlope = 46.88Mbps

# configure switch1
*.switch1.eth[1].macLayer.queue.hasGcl = true
*.switch1.eth[1].macLayer.queue.gateControlList.offset = 0us
*.switch1.eth[1].macLayer.queue.gateControlList.durations = [150us, 125us, 125us, 100us]
*.switch1.eth[1].macLayer.queue.gateControlList.gateStates = ["10111111", "00000000", "01000000", "10111111"]
*.switch1.eth[1].macLayer.queue.transmissionSelectionAlgorithm[5].typename = "Ieee8021qCreditBasedShaper"
*.switch1.eth[1].macLayer.queue.transmissionSelectionAlgorithm[5].idleSlope = 37.504Mbps


###############################
# Ingress Filtering Configuration
[Config WithQci]
# enable ingress per-stream filtering
*.switch1.hasIngressTrafficFiltering = true

# Per Stream filtering
*.switch1.bridging.streamFilter.ingress.typename = "Ieee8021qFilter"

*.switch1.bridging.streamFilter.ingress.numStreams = 4
*.switch1.bridging.streamFilter.ingress.numGates = 3
*.switch1.bridging.streamFilter.ingress.numMeters = 2
*.switch1.bridging.streamFilter.ingress.streamFilterTable = [{stream: "STimed", gate:1, meter:0},
															 {stream: "SDatasteam", gate:0, meter:1},
															 {stream: "SControlsignal", gate:2, meter:0},
															 {stream: "*", gate: 0, meter: 0}]
*.switch1.bridging.streamFilter.ingress.gc[0].mapping = {"SDatasteam":1}

#*.switch1.bridging.streamFilter.ingress.*[0].display-name = "default"
*.switch1.bridging.streamFilter.ingress.gate*[1].display-name = "only gate"
*.switch1.bridging.streamFilter.ingress.gate*[2].display-name = "only filter"
*.switch1.bridging.streamFilter.ingress.meter[1].display-name = "support CBS"
*.switch1.bridging.streamFilter.ingress.flowFilter[1].display-name = "support CBS"

# gate configurations
*.switch1.bridging.streamFilter.ingress.gate[1].typename= "PeriodicGate"
# 0: "default" no filter + always open
# 1: "timed" no filter + scheduled gates
*.switch1.bridging.streamFilter.ingress.gate[1].initiallyOpen = true
*.switch1.bridging.streamFilter.ingress.gate[1].enableImplicitGuardBand = false
*.switch1.bridging.streamFilter.ingress.gate[1].offset = 0.000250s 
*.switch1.bridging.streamFilter.ingress.gate[1].durations = [0.000050s, 0.000450s] 
*.switch1.bridging.streamFilter.ingress.gateFilter[2].typename= "MultiPacketFilter" 
*.switch1.bridging.streamFilter.ingress.gateFilter[2].numFilters = 2
*.switch1.bridging.streamFilter.ingress.gateFilter[2].filter[0].typename = "ContentBasedFilter"
*.switch1.bridging.streamFilter.ingress.gateFilter[2].filter[1].typename = "BackPressureBasedFilter"
	# Configurations for Controlsignal "BE" [pcp4]
*.switch1.bridging.streamFilter.ingress.gateFilter[2].filter[0].packetFilter = expr(totalLength <= 72B) 

# meter configurations
# 0: no meter + no filter
*.switch1.bridging.streamFilter.ingress.meter[0].typename = "OmittedPacketMeter"
*.switch1.bridging.streamFilter.ingress.flowFilter[0].typename = "OmittedPacketFilter"
# 1: "CBS" SingleRateTwoColorMeter + LabelFilter
*.switch1.bridging.streamFilter.ingress.meter[1].typename = "SingleRateTwoColorMeter"
*.switch1.bridging.streamFilter.ingress.flowFilter[1].typename = "LabelFilter"
# Configurations for Datastream (shaped) "AVB" [pcp5]
*.switch1.bridging.streamFilter.ingress.meter[1].committedInformationRate = 18.752Mbps
*.switch1.bridging.streamFilter.ingress.meter[1].committedBurstSize = 1230B # 5 Dataframes, using the Packetsize in Filter (240B)


###############################
# Ingress Filtering Configuration
[Config WithQci_originalBehaviour]
# burst size for datastream is large enough that injection_upper_datastream cannot be detected
*.switch1.bridging.streamFilter.ingress.meter[1].committedBurstSize = 1380B+1522B # 5 Datastream Frames + 1 Fullsize


[Config WithQci_DataStreamSDUFilter]
extends = WithQci

*.switch1.bridging.streamFilter.ingress.numGates = 4
*.switch1.bridging.streamFilter.ingress.streamFilterTable = [{stream: "STimed", gate:1, meter:0},
															 {stream: "SDatasteam", gate:3, meter:1},
															 {stream: "SControlsignal", gate:2, meter:0},
															 {stream: "*", gate: 0, meter: 0}]
*.switch1.bridging.streamFilter.ingress.gateFilter[3].typename= "MultiPacketFilter"
*.switch1.bridging.streamFilter.ingress.gateFilter[3].numFilters = 2
*.switch1.bridging.streamFilter.ingress.gateFilter[3].filter[0].typename = "ContentBasedFilter"
*.switch1.bridging.streamFilter.ingress.gateFilter[3].filter[1].typename = "BackPressureBasedFilter"
*.switch1.bridging.streamFilter.ingress.gateFilter[3].filter[0].packetFilter = expr(totalLength <= 276B)


###############################
# Ingress Filtering Configuration
[Config WithATS]

extends = WithQci

# ATS on node 1
*.node1.hasEgressTrafficFiltering = true
*.node1.bridging.streamFilter.egress.typename = "SimpleIeee8021qFilter"
*.node1.bridging.streamFilter.egress.numStreams = 1
*.node1.bridging.streamFilter.egress.classifier.mapping = {"SDatasteam": 0}

*.node1.bridging.streamFilter.egress.meter[0].typename ="EligibilityTimeMeter"
*.node1.bridging.streamFilter.egress.filter[0].typename = "EligibilityTimeFilter"

*.node1.bridging.streamFilter.egress.meter[0].committedInformationRate = 18.752Mbps
*.node1.bridging.streamFilter.egress.meter[0].committedBurstSize = 276B
*.node1.bridging.streamFilter.egress.meter[0].packetOverheadLength = 30B

*.node1.eth[0].macLayer.queue.queue[5].typename = "EligibilityTimeQueue"
*.node1.eth[0].macLayer.queue.transmissionSelectionAlgorithm[5].typename = "EligibilityTimeGate"

# Per Stream filtering on switch 1
*.switch1.bridging.streamFilter.ingress.typename = "micronetFilter"

*.switch1.bridging.streamFilter.ingress.numGates = 4 
*.switch1.bridging.streamFilter.ingress.streamFilterTable = [{stream: "STimed", gate:1, meter:0},
															 {stream: "SDatasteam", gate:3, meter:1},
															 {stream: "SControlsignal", gate:2, meter:0},
															 {stream: "*", gate: 0, meter: 0}]

# SDU filtering for Datastream
*.switch1.bridging.streamFilter.ingress.gateFilter[3].typename= "MultiPacketFilter" 
*.switch1.bridging.streamFilter.ingress.gateFilter[3].numFilters = 2
*.switch1.bridging.streamFilter.ingress.gateFilter[3].filter[0].typename = "ContentBasedFilter"
*.switch1.bridging.streamFilter.ingress.gateFilter[3].filter[1].typename = "BackPressureBasedFilter"
*.switch1.bridging.streamFilter.ingress.gateFilter[3].filter[0].packetFilter = expr(totalLength <= 276B) 

# Overwrite meter+filter 1 for ATS
*.switch1.bridging.streamFilter.ingress.meter[1].typename = "GroupEligibilityTimeMeterWithStatistics"
*.switch1.bridging.streamFilter.ingress.flowFilter[1].typename = "EligibilityTimeFilter"
	# Configurations for Datastream (shaped) "AVB" [pcp5]
*.switch1.bridging.streamFilter.ingress.meter[1].committedInformationRate = 18.752Mbps
*.switch1.bridging.streamFilter.ingress.meter[1].committedBurstSize = 1656B
*.switch1.bridging.streamFilter.ingress.meter[1].maxResidenceTime = 0.1ms 
*.switch1.bridging.streamFilter.ingress.meter[1].packetOverheadLength = 30B 

*.switch1.eth[1].macLayer.queue.queue[5].typename = "EligibilityTimeQueue"
*.switch1.eth[1].macLayer.queue.transmissionSelectionAlgorithm[5].typename = "EligibilityTimeGate"


###############################
# Adding a second datastream, to see differences between CBS and ATS
[Config SecondDatastream]

*.node1.numApps = 5
# split Datastream into two streams with half the production interval
*.node1.app[1].source.packetLength = 218B # => 276B on phy
*.node1.app[1].source.productionInterval = 250us

*.node1.app[4].source.packetNameFormat = "%M->Datasteam2->%c"
*.node1.app[4].source.packetLength = 218B # => 276B on phy
*.node1.app[4].source.productionInterval = 250us
# *.node1.app[4].source.initialProductionOffset = 125us
*.node1.app[4].io.destPort = 12105

*.node2.numApps = 5
*.node2.app[4].display-name = "Datasteam2 sink"
*.node2.app[4].io.localPort = 12105


# node1 identification and encoding
*.node1.bridging.streamIdentifier.identifier.mapping = [{stream: "SSync", packetFilter: expr(name =~ "*Gptp*")},
                                                        {stream: "STimed", packetFilter: expr(has(udp) && udp.destPort == 11006)},
													  	{stream: "SDatasteam", packetFilter: expr(has(udp) && udp.destPort == 12005)},
														{stream: "SControlsignal", packetFilter: expr(has(udp) && udp.destPort == 13004)},
														{stream: "SBackground", packetFilter: expr(has(udp) && udp.destPort == 10000)},
														{stream: "SDatasteam2", packetFilter: expr(has(udp) && udp.destPort == 12105)}]
*.node1.bridging.streamCoder.encoder.mapping = [{stream: "SSync", vlan: 0, pcp: 7},
                                                {stream: "STimed", vlan: 1, pcp: 6},
												{stream: "SDatasteam", vlan: 2, pcp: 5},
												{stream: "SControlsignal", vlan: 3, pcp: 4},
												{stream: "SBackground", vlan: 0, pcp: 0},
												{stream: "SDatasteam2", vlan: 4, pcp: 5}] # Vlan is a workaround for en/decoding

# node2 identification and coding
*.node2.bridging.streamIdentifier.identifier.mapping = [{stream: "SSync", packetFilter: expr(name =~ "*Gptp*")}]
*.node2.bridging.streamCoder.encoder.mapping = [{stream: "SSync", vlan: 0, pcp: 7}]
*.node2.bridging.streamCoder.decoder.mapping = [{destination: "node2", vlan: 1, pcp: 6, stream: "STimed"},
                                                {destination: "node2", vlan: 2, pcp: 5, stream: "SDatasteam"},
                                                {destination: "node2", vlan: 3, pcp: 4, stream: "SControlsignal"},
                                                {destination: "node2", vlan: 0, pcp: 0, stream: "SBackground"},
												{destination: "node2", vlan: 4, pcp: 5, stream: "SDatasteam2"}]

# switch identification and coding
*.switch1.bridging.streamIdentifier.identifier.mapping = [{stream: "SSync", packetFilter: expr(name =~ "*Gptp*")}]
*.switch1.bridging.streamCoder.decoder.mapping = [{destination: "node2", vlan: 1, pcp: 6, stream: "STimed"},
                                                  {destination: "node2", vlan: 2, pcp: 5, stream: "SDatasteam"},
                                                  {destination: "node2", vlan: 3, pcp: 4, stream: "SControlsignal"},
                                                  {destination: "node2", vlan: 0, pcp: 0, stream: "SBackground"},
												  {pcp: 7, stream: "SSync"},
												  {destination: "node2", vlan: 4, pcp: 5, stream: "SDatasteam2"}]
*.switch1.bridging.streamCoder.encoder.mapping = [{stream: "SSync", vlan: 0, pcp: 7},
                                                  {stream: "STimed", vlan: 1, pcp: 6},
												  {stream: "SDatasteam", vlan: 2, pcp: 5},
												  {stream: "SControlsignal", vlan: 3, pcp: 4},
												  {stream: "SBackground", vlan: 0, pcp: 0},
												  {stream: "SDatasteam2", vlan: 4, pcp: 5},]


[Config SecondDatastream_WithQci]
extends = SecondDatastream, WithQci
*.switch1.bridging.streamFilter.ingress.numStreams = 5
*.switch1.bridging.streamFilter.ingress.streamFilterTable = [{stream: "STimed", gate:1, meter:0},
															 {stream: "SDatasteam", gate:0, meter:1},
															 {stream: "SControlsignal", gate:2, meter:0},
															 {stream: "SDatasteam2", gate:0, meter:1},
															 {stream: "*", gate: 0, meter: 0}]
*.switch1.bridging.streamFilter.ingress.gc[0].mapping = {"SDatasteam":1, "SDatasteam2":1}


[Config SecondDatastream_WithQci_DataStreamSDUFilter]
extends = SecondDatastream_WithQci
*.switch1.bridging.streamFilter.ingress.numGates = 4
*.switch1.bridging.streamFilter.ingress.streamFilterTable = [{stream: "STimed", gate:1, meter:0},
															 {stream: "SDatasteam", gate:3, meter:1},
															 {stream: "SControlsignal", gate:2, meter:0},
															 {stream: "SDatasteam2", gate:3, meter:1},
															 {stream: "*", gate: 0, meter: 0}]
*.switch1.bridging.streamFilter.ingress.gateFilter[3].typename= "MultiPacketFilter"
*.switch1.bridging.streamFilter.ingress.gateFilter[3].numFilters = 2
*.switch1.bridging.streamFilter.ingress.gateFilter[3].filter[0].typename = "ContentBasedFilter"
*.switch1.bridging.streamFilter.ingress.gateFilter[3].filter[1].typename = "BackPressureBasedFilter"
*.switch1.bridging.streamFilter.ingress.gateFilter[3].filter[0].packetFilter = expr(totalLength <= 276B)


[Config SecondDatastream_WithATS]
extends = SecondDatastream, WithATS

*.node1.bridging.streamFilter.egress.numStreams = 2
*.node1.bridging.streamFilter.egress.classifier.mapping = {"SDatasteam": 0, "SDatasteam2": 1}

*.node1.bridging.streamFilter.egress.meter[0..1].typename ="EligibilityTimeMeter"
*.node1.bridging.streamFilter.egress.filter[0..1].typename = "EligibilityTimeFilter"

*.node1.bridging.streamFilter.egress.meter[0..1].committedInformationRate = 18.752Mbps
*.node1.bridging.streamFilter.egress.meter[0..1].committedBurstSize = 276B 
*.node1.bridging.streamFilter.egress.meter[0..1].packetOverheadLength = 30B 

*.node1.eth[0].macLayer.queue.queue[5].typename = "EligibilityTimeQueue"
*.node1.eth[0].macLayer.queue.transmissionSelectionAlgorithm[5].typename = "EligibilityTimeGate"

# Per Stream filtering on switch 1
*.switch1.bridging.streamFilter.ingress.typename = "micronetFilter"

*.switch1.bridging.streamFilter.ingress.numStreams = 5
*.switch1.bridging.streamFilter.ingress.numGates = 4
*.switch1.bridging.streamFilter.ingress.numMeters = 3
*.switch1.bridging.streamFilter.ingress.streamFilterTable = [{stream: "STimed", gate:1, meter:0},
															 {stream: "SDatasteam", gate:3, meter:1},
															 {stream: "SControlsignal", gate:2, meter:0},
															 {stream: "SDatasteam2", gate:3, meter:2},
															 {stream: "*", gate: 0, meter: 0}]
*.switch1.bridging.streamFilter.ingress.gc[3].mapping = {"SDatasteam":0, "SDatasteam2":1}

# SDU filtering for Datastream
*.switch1.bridging.streamFilter.ingress.gateFilter[3].typename= "MultiPacketFilter" 
*.switch1.bridging.streamFilter.ingress.gateFilter[3].numFilters = 2
*.switch1.bridging.streamFilter.ingress.gateFilter[3].filter[0].typename = "ContentBasedFilter"
*.switch1.bridging.streamFilter.ingress.gateFilter[3].filter[1].typename = "BackPressureBasedFilter"
*.switch1.bridging.streamFilter.ingress.gateFilter[3].filter[0].packetFilter = expr(totalLength <= 276B) 

# Overwrite meter+filter 1 for ATS
*.switch1.bridging.streamFilter.ingress.meter[1..2].typename = "GroupEligibilityTimeMeterWithStatistics"
*.switch1.bridging.streamFilter.ingress.flowFilter[1..2].typename = "EligibilityTimeFilter"
	# Configurations for Datastream (shaped) "AVB" [pcp5]
*.switch1.bridging.streamFilter.ingress.meter[1..2].committedInformationRate = 9.376Mbps 
*.switch1.bridging.streamFilter.ingress.meter[1..2].committedBurstSize = 1656B
*.switch1.bridging.streamFilter.ingress.meter[1..2].maxResidenceTime = 0.1ms 
*.switch1.bridging.streamFilter.ingress.meter[1..2].packetOverheadLength = 30B 

*.switch1.eth[1].macLayer.queue.queue[5].typename = "EligibilityTimeQueue"
*.switch1.eth[1].macLayer.queue.transmissionSelectionAlgorithm[5].typename = "EligibilityTimeGate"


###############################
# No Result Recording
[Config NoResultRecording]
**.statistic-recording = false
**.scalar-recording = false
**.vector-recording = false
**.bin-recording = false


###############################
# PCAP Recording
[Config PcapRecording]
**.crcMode = "computed"
**.fcsMode = "computed"
*.switch*.numPcapRecordersWithLabeling = 1
*.switch*.pcapRecorderWithLabeling[0].pcapLinkType = 1 # Ethernet
*.switch1.pcapRecorderWithLabeling[0].pcapFile = "results/${configname}-#${runnumber}-switch1.all.pcap"
*.switch*.pcapRecorderWithLabeling[0].moduleNamePatterns = "eth[*]"
*.switch*.pcapRecorderWithLabeling[0].sendingSignalNames = ""

###################################
# Repetitions
[Config Repeat10]
repeat = 10

####################################
# Basic Anomaly Configuration
[Config AnomalyBase]
*.node1.eth[*].macLayer.typename = "CorruptEthernetMacLayer"
*.switch1.eth[*].macLayer.typename = "CorruptEthernetMacLayer"


####################################
# Comparable Scenario Configurations
[Config Baseline]
extends = WithQci

[Config Baseline_GenerateDataset]
extends = WithQci, PcapRecording, NoResultRecording

[Config Baseline_Repeat10]
extends = WithQci, Repeat10

[Config Baseline_DataStreamSDUFilter]
extends = WithQci_DataStreamSDUFilter

[Config Baseline_DataStreamSDUFilter_Repeat10]
extends = WithQci_DataStreamSDUFilter, Repeat10

[Config Baseline_2S]
extends = SecondDatastream_WithQci

[Config Baseline_2S_DataStreamSDUFilter]
extends = SecondDatastream_WithQci_DataStreamSDUFilter

####################################
# Needed Tokens for metering
[Config Parameters_Tokens]
extends = Baseline
*.switch1.bridging.streamFilter.ingress.meter[1].committedBurstSize = ${burstsize=5,6,10,12}*276B 



###############
# Injection Scenarios
# corruptUpperLayer
[Config Corrupt_Injection_Upper_Timed]
extends = WithQci, AnomalyBase
*.labelManager.label = "STimed_INJECTION"
*.node1.eth[0].macLayer.corruptUpperLayer.typename = "CorruptPacketInjection"
*.node1.eth[0].macLayer.corruptUpperLayer.destPort = 11006
*.node1.eth[0].macLayer.corruptUpperLayer.srcPort = 1025
*.node1.eth[0].macLayer.corruptUpperLayer.destIpAddress = "10.0.0.2"
*.node1.eth[0].macLayer.corruptUpperLayer.srcIpAddress = "10.0.0.1"
*.node1.eth[0].macLayer.corruptUpperLayer.destMacAddress = "0A-AA-00-00-00-02"
*.node1.eth[0].macLayer.corruptUpperLayer.srcMacAddress = "0A-AA-00-00-00-01"
*.node1.eth[0].macLayer.corruptUpperLayer.priority = 6
*.node1.eth[0].macLayer.corruptUpperLayer.vid = 1
*.node1.eth[0].macLayer.corruptUpperLayer.injectionInterval = uniform (1ms,1.125ms)
*.node1.eth[0].macLayer.corruptUpperLayer.payload = intWithUnit(uniform(1Byte,1500Byte))

