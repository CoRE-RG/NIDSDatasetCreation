*.node1.bridging.streamFilter.egress.meter[0].committedBurstSize = ${nodeBurst = 1,2,4}*276B

[Config SecondDatastream_WithATS_Parametrized_Original]
extends = SecondDatastream_WithATS
*.switch1.bridging.streamFilter.ingress.meter[1..2].maxResidenceTime = ${maxResT = 0..400 step 100}us
*.switch1.bridging.streamFilter.ingress.meter[1].committedBurstSize = ${burst = 1..5 step 1}*276B
*.switch1.bridging.streamFilter.ingress.meter[2].committedBurstSize = 2*276B 

[Config SecondDatastream_WithATS_Parametrized]
extends = SecondDatastream_WithATS
# Smaller steps around the intresting values
*.switch1.bridging.streamFilter.ingress.meter[1..2].maxResidenceTime = ${maxResT = 0..250 step 50}us
*.switch1.bridging.streamFilter.ingress.meter[1..2].committedBurstSize = ${burst=276, 414, 552, 690}B # the following evaluates to non-integers: ${burst = 1..2.5 step 0.5}*276B 

